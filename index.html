  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"color:#5a4a38\">Oferta<\/a><a href=\"#faq\" style=\"color:#5a4a38\">FAQ<\/a>\n        <a href=\"https://pay.kiwify.com.br/QEo1At8\" target=\"_blank\" style=\"background:#23150b;color:#f2ebdf;padding:11px 22px;border-radius:12px;font-weight:700;font-size:13.5px\">Quero entrar<\/a>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- hero split -->\n  <div class=\"cc-hero\" style=\"max-width:1240px;margin:0 auto;display:grid;grid-template-columns:1.3fr 1fr;gap:52px;padding:72px 24px 80px;align-items:center\">\n    <div>\n      <div style=\"display:inline-flex;align-items:center;gap:8px;background:#e3d9c6;color:#7a5c33;font-size:12px;font-weight:700;letter-spacing:.12em;padding:8px 16px;border-radius:999px\">\u2615 CURSO AO VIVO \u00b7 DO ZERO AO AVAN\u00c7ADO<\/div>\n      <h1 class=\"cc-h1\" style=\"font-size:64px;line-height:1.04;font-weight:800;letter-spacing:-.02em;margin:24px 0 22px\">Entenda sobre o mercado de caf\u00e9 <span style=\"color:#2f6b3a\">no maior clube de caf\u00e9 do Brasil.<\/span><\/h1>\n      <p style=\"font-size:18px;line-height:1.65;color:#5a4a38;max-width:540px;margin:0 0 32px;font-weight:400\">Em <strong style=\"color:#23150b\">8 aulas ao vivo<\/strong>, voc\u00ea vai entender o que realmente move o caf\u00e9 verde, da bolsa de NY ao d\u00f3lar, do clima ao hedge.<\/p>\n      <div style=\"display:flex;align-items:center;gap:18px;flex-wrap:wrap\">\n        <a href=\"https://pay.kiwify.com.br/QEo1At8\" target=\"_blank\" style=\"display:inline-block;background:#2f6b3a;color:#f2ebdf;font-weight:800;letter-spacing:.04em;font-size:15px;padding:18px 34px;border-radius:14px;box-shadow:0 10px 24px rgba(47,107,58,.28)\" style-hover=\"background:#265a30;color:#f2ebdf\">QUERO ENTRAR NO COFFEE CLUB \u2192<\/a>\n        <span style=\"font-size:13.5px;color:#8a7355\">12x de <strong style=\"color:#23150b\">R$ 51,40<\/strong> no cart\u00e3o<\/span>\n      <\/div>\n      <div style=\"display:flex;gap:22px;margin-top:30px;font-size:13.5px;color:#7a6a52;flex-wrap:wrap\">\n        <span>\u2713 Aulas ao vivo + gravadas<\/span><span>\u2713 Grupo no WhatsApp<\/span><span>\u2713 Certificado<\/span><span>\u2713 12x no cart\u00e3o<\/span>\n      <\/div>\n    <\/div>\n    <div style=\"background:#fffdf7;border-radius:22px;padding:32px;box-shadow:0 24px 60px rgba(35,21,11,.14)\">\n      <div style=\"font-size:12px;font-weight:800;letter-spacing:.16em;color:#2f6b3a;margin-bottom:18px\">O QUE VOC\u00ca LEVA<\/div>\n      <div style=\"display:flex;flex-direction:column;gap:14px;font-size:15px;line-height:1.5;color:#3d2f20\">\n        <div style=\"display:flex;gap:12px;align-items:flex-start\"><span style=\"flex:none;width:22px;height:22px;border-radius:50%;background:#e6efdd;color:#2f6b3a;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800\">\u2713<\/span>8 aulas ao vivo (1 por semana, 2 meses de curso)<\/div>\n        <div style=\"display:flex;gap:12px;align-items:flex-start\"><span style=\"flex:none;width:22px;height:22px;border-radius:50%;background:#e6efdd;color:#2f6b3a;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800\">\u2713<\/span>Tira d\u00favidas ao vivo no final de cada aula<\/div>\n        <div style=\"display:flex;gap:12px;align-items:flex-start\"><span style=\"flex:none;width:22px;height:22px;border-radius:50%;background:#e6efdd;color:#2f6b3a;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800\">\u2713<\/span>Todas as aulas gravadas, assista quando quiser<\/div>\n        <div style=\"display:flex;gap:12px;align-items:flex-start\"><span style=\"flex:none;width:22px;height:22px;border-radius:50%;background:#e6efdd;color:#2f6b3a;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800\">\u2713<\/span>Grupo exclusivo no WhatsApp com os alunos<\/div>\n        <div style=\"display:flex;gap:12px;align-items:flex-start\"><span style=\"flex:none;width:22px;height:22px;border-radius:50%;background:#e6efdd;color:#2f6b3a;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800\">\u2713<\/span>Certificado de conclus\u00e3o<\/div>\n      <\/div>\n      <div style=\"border-top:1px dashed #d9cdb6;margin:22px 0 18px\"><\/div>\n      <div style=\"display:flex;align-items:baseline;gap:10px\"><span style=\"font-size:13.5px;color:#8a7355\">De <s>R$ 997,00<\/s> por<\/span><span style=\"font-size:34px;font-weight:800;color:#2f6b3a\">R$ 497,00<\/span><\/div>\n      <div style=\"font-size:13px;color:#8a7355;margin-top:4px\">\u00e0 vista ou 12x de R$ 51,40 \u00b7 cart\u00e3o, Pix ou boleto<\/div>\n    <\/div>\n  <\/div>\n\n  <!-- prova social: grupo whatsapp -->\n  <div style=\"background:#e9dfcd\">\n    <div style=\"max-width:1000px;margin:0 auto;padding:64px 24px;text-align:center\">\n      <div style=\"font-size:12px;font-weight:800;letter-spacing:.2em;color:#2f6b3a;margin-bottom:14px\">VOC\u00ca N\u00c3O ESTUDA SOZINHO<\/div>\n      <h2 style=\"font-size:34px;line-height:1.2;font-weight:800;margin:0 0 36px;max-width:680px;margin-left:auto;margin-right:auto\">Mais de <span style=\"color:#2f6b3a\">800 produtores e profissionais da \u00e1rea<\/span> j\u00e1 participaram do Coffee Club.<\/h2>\n      <div style=\"display:inline-flex;flex-direction:column;align-items:center;gap:14px;background:#fffdf7;border-radius:20px;padding:32px 48px;box-shadow:0 20px 50px rgba(35,21,11,.14)\">\n        <img src=\"07e1abda-5fe5-468c-b3c0-07c846ce862b\" alt=\"Logo Coffee Club\" style=\"width:88px;height:88px;border-radius:50%;object-fit:cover\">\n        <div style=\"font-size:20px;font-weight:800;color:#23150b\">Coffee Club \u2615<\/div>\n        <div style=\"font-size:15px;color:#5a4a38\">Grupo \u00b7 <strong style=\"color:#2f6b3a\">870 membros<\/strong><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- por que importa -->\n  <div id=\"curso\" style=\"background:#23150b;color:#f0e8da\">\n    <div class=\"cc-grid2 cc-section\" style=\"max-width:1240px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start;padding:88px 24px\">\n      <div>\n        <div style=\"font-size:12px;font-weight:800;letter-spacing:.2em;color:#c9a566;margin-bottom:16px\">POR QUE ISSO IMPORTA<\/div>\n        <h2 class=\"cc-h2\" style=\"font-size:40px;line-height:1.15;font-weight:800;margin:0\">Voc\u00ea convive com caf\u00e9 todo dia. Mas tem uma sensa\u00e7\u00e3o inc\u00f4moda: <span style=\"color:#9fd08a\">o pre\u00e7o se mexe, e voc\u00ea n\u00e3o sabe explicar por qu\u00ea.<\/span><\/h2>\n      <\/div>\n      <div style=\"padding-top:44px\">\n        <p style=\"font-size:17px;line-height:1.75;color:#cbbfa9;margin:0 0 16px\">Sobe, cai, dispara numa semana, e voc\u00ea s\u00f3 descobre depois que j\u00e1 era tarde. \u00c9 como jogar um jogo sem conhecer as regras.<\/p>\n        <p style=\"font-size:17px;line-height:1.75;color:#cbbfa9;margin:0\">O Coffee Club existe pra virar essa chave. Aula ap\u00f3s aula, ao vivo, voc\u00ea vai enxergar o mercado por dentro, e finalmente operar com clareza, n\u00e3o com medo.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- dores -->\n  <div class=\"cc-section\" style=\"max-width:1240px;margin:0 auto;padding:88px 24px\">\n    <div style=\"text-align:center;margin-bottom:48px\">\n      <div style=\"font-size:12px;font-weight:800;letter-spacing:.2em;color:#a4552f\">SE VOC\u00ca ATUA COM CAF\u00c9 OU QUER APRENDER, VAMOS TE ENSINAR<\/div>\n      <h2 class=\"cc-h2\" style=\"font-size:42px;line-height:1.12;font-weight:800;margin:14px auto 0;max-width:640px\">N\u00e3o \u00e9 falta de capacidade. \u00c9 falta de algu\u00e9m pra mostrar o caminho.<\/h2>\n    <\/div>\n    <div class=\"cc-grid3\" style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px\">\n      <div style=\"background:#fffdf7;border-radius:18px;padding:26px;box-shadow:0 8px 24px rgba(35,21,11,.07)\"><div style=\"width:30px;height:30px;border-radius:50%;background:#f6e0d2;display:flex;align-items:center;justify-content:center;font-size:15px;margin-bottom:14px\">\ud83d\ude13<\/div><div style=\"font-size:15.5px;line-height:1.55;color:#4a3a29\">Aquela sensa\u00e7\u00e3o de estar sempre um passo atr\u00e1s do pre\u00e7o.<\/div><\/div>\n      <div style=\"background:#fffdf7;border-radius:18px;padding:26px;box-shadow:0 8px 24px rgba(35,21,11,.07)\"><div style=\"width:30px;height:30px;border-radius:50%;background:#f6e0d2;display:flex;align-items:center;justify-content:center;font-size:15px;margin-bottom:14px\">\ud83d\udcc9<\/div><div style=\"font-size:15.5px;line-height:1.55;color:#4a3a29\">Ver o caf\u00e9 despencar e n\u00e3o saber se foi o d\u00f3lar, o clima ou a bolsa.<\/div><\/div>\n      <div style=\"background:#fffdf7;border-radius:18px;padding:26px;box-shadow:0 8px 24px rgba(35,21,11,.07)\"><div style=\"width:30px;height:30px;border-radius:50%;background:#f6e0d2;display:flex;align-items:center;justify-content:center;font-size:15px;margin-bottom:14px\">\ud83d\udcb8<\/div><div style=\"font-size:15.5px;line-height:1.55;color:#4a3a29\">Precificar \"no achismo\" e depois descobrir que deixou dinheiro na mesa.<\/div><\/div>\n      <div style=\"background:#fffdf7;border-radius:18px;padding:26px;box-shadow:0 8px 24px rgba(35,21,11,.07)\"><div style=\"width:30px;height:30px;border-radius:50%;background:#f6e0d2;display:flex;align-items:center;justify-content:center;font-size:15px;margin-bottom:14px\">\ud83e\udd2f<\/div><div style=\"font-size:15.5px;line-height:1.55;color:#4a3a29\">Ouvir falar de NDF, call, put, e travar, porque ningu\u00e9m nunca te explicou direito.<\/div><\/div>\n      <div style=\"background:#fffdf7;border-radius:18px;padding:26px;box-shadow:0 8px 24px rgba(35,21,11,.07)\"><div style=\"width:30px;height:30px;border-radius:50%;background:#f6e0d2;display:flex;align-items:center;justify-content:center;font-size:15px;margin-bottom:14px\">\ud83e\udd37<\/div><div style=\"font-size:15.5px;line-height:1.55;color:#4a3a29\">Depender da opini\u00e3o dos outros pra tomar sua
